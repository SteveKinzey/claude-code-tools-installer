name: Weekly dependency and security scan

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit locked desktop dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install virtual display for renderer validation
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Validate desktop and workflow security contracts
        run: npm run check

      - name: Scan dependency vulnerabilities
        # The complete check includes an audit and can fail before this step.
        # Still capture the JSON evidence; retain the audit's failing exit status.
        if: ${{ always() && !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p ../security-reports
          audit_status=0
          npm audit --json > ../security-reports/npm-audit.json || audit_status=$?
          node -e 'const r = require("../security-reports/npm-audit.json"); if (r.error || !r.metadata?.vulnerabilities) process.exit(1)'
          if [[ "$audit_status" -gt 1 ]]; then
            exit "$audit_status"
          fi
          npm audit --audit-level=high

      - name: Upload vulnerability scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccti-weekly-npm-audit-${{ github.run_id }}
          path: security-reports/npm-audit.json
          if-no-files-found: warn
          retention-days: 30
