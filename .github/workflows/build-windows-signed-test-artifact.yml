name: Build signed Windows CCTI test artifact

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-sign-verify:
    name: Build, sign, and verify Windows test artifact
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
      - name: Install and validate desktop dependencies
        run: |
          npm ci
          npm run check
      - name: Build the Windows ZIP
        run: npm run dist:win:zip
      - id: package
        name: Expand ZIP for signing
        run: |
          $source = Get-ChildItem ../releases/test-builds/*.zip | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $source) { throw "No Windows ZIP was produced." }
          $dir = Join-Path $env:RUNNER_TEMP "ccti-windows-signed-test"
          Expand-Archive -Path $source.FullName -DestinationPath $dir -Force
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executables and libraries
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ steps.package.outputs.dir }}
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify every signature
        run: |
          $files = Get-ChildItem -Path "${{ steps.package.outputs.dir }}" -Recurse -Include *.exe,*.dll
          if (-not $files) { throw "No executable files were found." }
          $files | ForEach-Object { if ((Get-AuthenticodeSignature $_.FullName).Status -ne "Valid") { throw "Invalid signature: $($_.FullName)" } }
      - id: signed
        name: Create signed test ZIP and checksum
        run: |
          $out = "../releases/test-builds/signed"
          $zip = "$out/claude-code-tools-installer-windows-test-${{ github.sha }}.zip"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Compress-Archive -Path "${{ steps.package.outputs.dir }}\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $([System.IO.Path]::GetFileName($zip))" | Set-Content -NoNewline "$out/sha256sums.txt"
      - name: Upload signed test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccti-windows-signed-test-${{ github.sha }}
          path: |
            releases/test-builds/signed/*.zip
            releases/test-builds/signed/sha256sums.txt
          if-no-files-found: error
          retention-days: 7
