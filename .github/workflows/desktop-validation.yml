name: Desktop validation

# Runs on every pull request so both validation jobs can be required checks on main. A pull
# request that touches none of the app, scripts, adapters or workflows skips the heavy jobs, and
# GitHub counts a skipped job as passing; a docs-only change is therefore never blocked waiting
# for a check that would not start.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect desktop-relevant changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - id: detect
        name: Compare changed files with the validated paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          relevant=false
          while IFS= read -r file; do
            case "$file" in
              desktop/*|scripts/*|setup-my-claude.sh|setup-my-claude-linux.sh|setup-my-claude.ps1|.github/workflows/*)
                relevant=true; echo "Desktop-relevant change: $file" ;;
            esac
          done <<< "$files"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "Desktop validation required: $relevant"

  validate:
    name: Complete desktop validation
    needs: changes
    # Fail safe: if change detection did not succeed, validate anyway rather than skip.
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Verify CCTI runtime PATH contract
        run: npm run runtime-path:check
      - name: Repeat Linux compact layout regression
        run: |
          for attempt in {1..6}; do
            echo "Compact layout attempt $attempt/6"
            npm run setup-verification:check
          done
      - name: Run complete desktop validation
        run: npm run check
      - name: Upload failed compact layout evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compact-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ccti-layout-evidence/
          if-no-files-found: ignore
          retention-days: 14

  validate-windows:
    # Mirrors the Windows release job so Windows-only test failures surface on
    # the pull request instead of during a tagged release.
    name: Complete desktop validation (Windows)
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.relevant == 'true') }}
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Run complete desktop validation
        run: npm run check
