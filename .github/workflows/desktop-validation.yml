name: Desktop validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/**'
      - 'setup-my-claude.sh'
      - 'setup-my-claude-linux.sh'
      - 'setup-my-claude.ps1'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Complete desktop validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Run complete desktop validation
        run: npm run check
