name: Desktop validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'scripts/**'
      - 'setup-my-claude.sh'
      - 'setup-my-claude-linux.sh'
      - 'setup-my-claude.ps1'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Complete desktop validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Verify CCTI runtime PATH contract
        run: npm run runtime-path:check
      - name: Run complete desktop validation
        run: npm run check

  validate-windows:
    # Mirrors the Windows release job so Windows-only test failures surface on
    # the pull request instead of during a tagged release.
    name: Complete desktop validation (Windows)
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Install locked desktop dependencies
        run: npm ci
      - name: Run complete desktop validation
        run: npm run check
