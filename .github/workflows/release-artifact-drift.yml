name: Check CCTI release artifact drift

on:
  create:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing dated tag to inspect, such as v2026.08.12"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ccti-release-artifact-drift-${{ github.event.repository.full_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Require a verified binary after the release grace period
    if: github.event_name == 'workflow_dispatch' || github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ inputs.tag }}
      EVENT_TAG: ${{ github.ref }}
      EVENT_CREATED_AT: ${{ github.event.repository.updated_at }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Check out release check script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: tag
        name: Identify a dated release tag
        shell: bash
        run: |
          tag="$EVENT_TAG"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi
          if [[ ! "$tag" =~ ^v?[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{2})?$ ]]; then
            echo "checked=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring non-release tag: ${tag:-missing}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "checked=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Fetch release inventory including superseding releases
        if: steps.tag.outputs.checked == 'true'
        id: release
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq 'add' > "$RUNNER_TEMP/releases.json"
          jq --arg tag "$TAG" 'first(.[] | select(.tag_name == $tag)) // null' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/release.json"

      - name: Evaluate executable artifact coverage
        if: steps.tag.outputs.checked == 'true'
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_FILE: ${{ runner.temp }}/release.json
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CREATED_AT: ${{ github.event.created_at }}
        run: |
          args=(scripts/check-release-artifact-drift.js --tag "$TAG" --release-file "$RELEASE_FILE" --releases-file "$RUNNER_TEMP/releases.json" --grace-hours 24)
          tag_created_at="$EVENT_CREATED_AT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag_created_at="$(git log -1 --format=%cI "${TAG}^{commit}" 2>/dev/null || true)"
          fi
          if [[ -n "$tag_created_at" ]]; then
            args+=(--tag-created-at "$tag_created_at")
          fi
          node "${args[@]}"

      - name: Explain remediation
        if: failure()
        shell: bash
        run: |
          {
            echo "## CCTI release artifact drift detected"
            echo
            echo "The dated tag has outlived the 24-hour release grace period without an uploaded, SHA-256-backed desktop artifact."
            echo "Complete the authorized platform trust and artifact publication gates, or propose an evidence-backed superseded-staging disposition through a protected PR. Preserve tags and draft assets."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify configured release-alert channel
        if: failure()
        env:
          CCTI_RELEASE_ALERT_WEBHOOK: ${{ secrets.CCTI_RELEASE_ALERT_WEBHOOK }}
          CCTI_RELEASE_ALERT_PROVIDER: ${{ vars.CCTI_RELEASE_ALERT_PROVIDER || 'slack' }}
        run: bash scripts/notify-release-drift.sh

  audit:
    name: Audit dated tags against verified binaries
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out all dated tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit published releases and tags
        shell: bash
        run: |
          set -euo pipefail
          releases="$RUNNER_TEMP/releases.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq 'add' > "$releases"
          failures=0
          checked=0
          # Include registered originals even when a ref has disappeared.
          node scripts/check-release-artifact-drift.js --list-audit-tags > "$RUNNER_TEMP/dated-tags.txt"

          while IFS= read -r tag; do
            [[ "$tag" =~ ^v?[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{2})?$ ]] || continue
            checked=$((checked + 1))
            release="$RUNNER_TEMP/release-${checked}.json"
            jq --arg tag "$tag" 'first(.[] | select(.tag_name == $tag)) // null' "$releases" > "$release"
            created_at="$(git log -1 --format=%cI "${tag}^{commit}" 2>/dev/null || true)"
            if ! node scripts/check-release-artifact-drift.js --tag "$tag" --release-file "$release" --releases-file "$releases" --tag-created-at "$created_at" --grace-hours 24; then
              failures=1
            fi
          done < "$RUNNER_TEMP/dated-tags.txt"

          echo "Audited ${checked} dated CCTI tag(s)." >> "$GITHUB_STEP_SUMMARY"
          exit "$failures"

      - name: Explain remediation
        if: failure()
        shell: bash
        run: |
          {
            echo "## CCTI release artifact drift detected"
            echo
            echo "At least one dated tag has outlived the 24-hour grace period without an uploaded, SHA-256-backed desktop artifact."
            echo "Complete the authorized platform trust and artifact publication gates, or propose an evidence-backed superseded-staging disposition through a protected PR. Preserve tags and draft assets."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify configured release-alert channel
        if: failure()
        env:
          CCTI_RELEASE_ALERT_WEBHOOK: ${{ secrets.CCTI_RELEASE_ALERT_WEBHOOK }}
          CCTI_RELEASE_ALERT_PROVIDER: ${{ vars.CCTI_RELEASE_ALERT_PROVIDER || 'slack' }}
        run: bash scripts/notify-release-drift.sh
