name: Test Microsoft Store MSIX on clean Windows

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Build and test a non-submission MSIX fixture without Partner Center secrets"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  clean-windows-install-test:
    name: Prepare isolated Store test bundle and verify install lifecycle
    runs-on: windows-2022
    timeout-minutes: 35
    environment: msix-store-release
    defaults:
      run:
        working-directory: desktop
        shell: powershell
    env:
      CCTI_APPX_IDENTITY_NAME: ${{ inputs.test_mode && 'CCTI.LocalValidation' || secrets.CCTI_APPX_IDENTITY_NAME }}
      CCTI_APPX_PUBLISHER: ${{ inputs.test_mode && 'CN=CCTI Local Validation' || secrets.CCTI_APPX_PUBLISHER }}
      CCTI_APPX_PUBLISHER_DISPLAY_NAME: ${{ inputs.test_mode && 'CCTI Local Validation' || secrets.CCTI_APPX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install desktop dependencies
        run: npm ci

      - name: Validate desktop contracts
        run: npm run check

      - name: Validate protected identity inputs
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.test_mode }}' -eq 'true') {
            Write-Host 'Test mode uses a non-submission fixture identity. The output must not be uploaded to Partner Center.'
            return
          }
          foreach ($name in 'CCTI_APPX_IDENTITY_NAME', 'CCTI_APPX_PUBLISHER', 'CCTI_APPX_PUBLISHER_DISPLAY_NAME') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required protected identity secret is unavailable: $name"
            }
          }

      - name: Build Store package candidates
        run: |
          npm run msix:prepare
          npm run dist:win:store:x64
          npm run dist:win:store:arm64

      - name: Bundle, install, launch, and uninstall
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Resolve-Path '../releases/test-builds'
          $appx = @(Get-ChildItem -Path $output -Filter '*.appx' -File | Sort-Object Name)
          if ($appx.Count -ne 2) { throw "Expected one x64 and one ARM64 .appx package; found $($appx.Count)." }

          $makeAppx = Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Filter 'MakeAppx.exe' -File -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          $signTool = Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Filter 'signtool.exe' -File -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx -or -not $signTool) { throw 'Windows App SDK packaging tools were not found on the runner.' }

          $staging = Join-Path $env:RUNNER_TEMP 'ccti-clean-install-bundle-input'
          $bundle = Join-Path $env:RUNNER_TEMP 'claude-code-tools-installer-clean-install-test.msixbundle'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Path $appx.FullName -Destination $staging -Force
          & $makeAppx.FullName bundle /d $staging /p $bundle /o
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle)) { throw 'MakeAppx did not create the temporary test bundle.' }

          # Fresh, one-run development certificate. It is not uploaded, reused, or used for Store submission.
          $certificate = New-SelfSignedCertificate `
            -Subject $env:CCTI_APPX_PUBLISHER `
            -Type CodeSigningCert `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -NotAfter (Get-Date).AddDays(1)
          if ($certificate.Subject -ne $env:CCTI_APPX_PUBLISHER) { throw 'Temporary certificate subject does not match the exact Partner Center publisher.' }

          & $signTool.FullName sign /fd SHA256 /sha1 $certificate.Thumbprint $bundle
          if ($LASTEXITCODE -ne 0) { throw 'SignTool could not sign the temporary MSIX bundle.' }
          $certificateFile = Join-Path $env:RUNNER_TEMP 'ccti-clean-install-test.cer'
          Export-Certificate -Cert $certificate -FilePath $certificateFile | Out-Null
          Import-Certificate -FilePath $certificateFile -CertStoreLocation 'Cert:\LocalMachine\TrustedPeople' | Out-Null
          Import-Certificate -FilePath $certificateFile -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          & $signTool.FullName verify /pa /v $bundle
          if ($LASTEXITCODE -ne 0) { throw 'SignTool verification failed for the temporary MSIX bundle.' }

          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name 'AllowAllTrustedApps' -Value 1 -Type DWord
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name 'AllowDevelopmentWithoutDevLicense' -Value 1 -Type DWord

          Add-AppxPackage -Path $bundle
          $registered = Get-AppxPackage -Name $env:CCTI_APPX_IDENTITY_NAME
          if (-not $registered) { throw 'The temporary MSIX bundle was not registered after installation.' }
          $expectedExecutable = Join-Path $registered.InstallLocation 'app\Claude Code Tools Installer.exe'
          if (-not (Test-Path $expectedExecutable)) { throw "Installed application executable not found: $expectedExecutable" }

          [xml]$manifest = Get-AppxPackageManifest -Package $registered.PackageFullName
          $appId = $manifest.Package.Applications.Application.Id
          $aumid = "$($registered.PackageFamilyName)!$appId"
          Write-Host "Installed AUMID: $aumid"

          Start-Process "shell:AppsFolder\$aumid"
          Start-Sleep -Seconds 5
          $running = Get-Process -Name 'Claude Code Tools Installer' -ErrorAction SilentlyContinue
          if ($running) {
            Write-Host "Process running via AUMID launch (PID $($running[0].Id))."
            $running | Stop-Process -Force -ErrorAction SilentlyContinue
          } else {
            Write-Host "AUMID launch did not start in non-interactive CI session; verifying binary execution via granted ACL..."
            & icacls $registered.InstallLocation /grant 'Users:(OI)(CI)RX' /q
            $process = Start-Process -FilePath $expectedExecutable -PassThru
            Start-Sleep -Seconds 5
            $process.Refresh()
            if ($process.HasExited) { throw "Installed desktop process exited immediately (exit code $($process.ExitCode))." }
            Write-Host "Process running directly (PID $($process.Id))."
            Stop-Process -Id $process.Id -Force
          }

          Remove-AppxPackage -Package $registered.PackageFullName
          if (Get-AppxPackage -Name $env:CCTI_APPX_IDENTITY_NAME) { throw 'Package remains registered after uninstall.' }
          Write-Host 'Clean Windows install, process-start, and uninstall lifecycle passed.'

      - name: Remove generated Store configuration
        if: always()
        run: Remove-Item -Force 'build/appx-store.resolved.json' -ErrorAction SilentlyContinue
