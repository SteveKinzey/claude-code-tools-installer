name: Test Microsoft Store MSIX on clean Windows

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Build and test a non-submission MSIX fixture without Partner Center secrets"
        required: false
        default: false
        type: boolean
      source_tag:
        description: "Optional existing source tag to build without retargeting the workflow"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  clean-windows-install-test:
    name: Prepare isolated Store test bundle and verify install lifecycle
    runs-on: windows-2022
    timeout-minutes: 35
    environment: msix-store-release
    defaults:
      run:
        working-directory: desktop
        shell: powershell
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare immutable runtime source
        if: inputs.source_tag != ''
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          [[ "$SOURCE_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]] || {
            echo "source_tag must be an existing dated tag such as v2026.09.11." >&2
            exit 2
          }
          git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "${SOURCE_TAG}^{commit}" >/dev/null || {
            echo "source_tag was not found: $SOURCE_TAG" >&2
            exit 2
          }
          git -C "$GITHUB_WORKSPACE" checkout "$SOURCE_TAG" -- desktop setup-my-claude.sh setup-my-claude-linux.sh setup-my-claude.ps1
          git -C "$GITHUB_WORKSPACE" diff --quiet "$SOURCE_TAG" -- desktop setup-my-claude.sh setup-my-claude-linux.sh setup-my-claude.ps1 || {
            echo "Runtime source does not exactly match $SOURCE_TAG." >&2
            exit 2
          }
          printf 'Testing runtime source: %s\n' "$(git -C "$GITHUB_WORKSPACE" rev-parse "${SOURCE_TAG}^{commit}")"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'

      - name: Install desktop dependencies
        run: npm ci

      - name: Validate desktop contracts
        run: npm run check

      - name: Validate protected identity inputs
        env:
          CCTI_APPX_IDENTITY_NAME: ${{ inputs.test_mode && 'CCTI.LocalValidation' || secrets.CCTI_APPX_IDENTITY_NAME }}
          CCTI_APPX_PUBLISHER: ${{ inputs.test_mode && 'CN=CCTI Local Validation' || secrets.CCTI_APPX_PUBLISHER }}
          CCTI_APPX_PUBLISHER_DISPLAY_NAME: ${{ inputs.test_mode && 'CCTI Local Validation' || secrets.CCTI_APPX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ inputs.test_mode }}' -eq 'true') {
            Write-Host 'Test mode uses a non-submission fixture identity. The output must not be uploaded to Partner Center.'
            return
          }
          foreach ($name in 'CCTI_APPX_IDENTITY_NAME', 'CCTI_APPX_PUBLISHER', 'CCTI_APPX_PUBLISHER_DISPLAY_NAME') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required protected identity secret is unavailable: $name"
            }
          }

      - name: Build Store package candidates
        env:
          CCTI_APPX_IDENTITY_NAME: ${{ inputs.test_mode && 'CCTI.LocalValidation' || secrets.CCTI_APPX_IDENTITY_NAME }}
          CCTI_APPX_PUBLISHER: ${{ inputs.test_mode && 'CN=CCTI Local Validation' || secrets.CCTI_APPX_PUBLISHER }}
          CCTI_APPX_PUBLISHER_DISPLAY_NAME: ${{ inputs.test_mode && 'CCTI Local Validation' || secrets.CCTI_APPX_PUBLISHER_DISPLAY_NAME }}
        run: |
          npm run msix:prepare
          npm run dist:win:store:x64
          npm run dist:win:store:arm64


      - name: Bundle and verify the isolated test candidate
        env:
          CCTI_APPX_IDENTITY_NAME: ${{ inputs.test_mode && 'CCTI.LocalValidation' || secrets.CCTI_APPX_IDENTITY_NAME }}
          CCTI_APPX_PUBLISHER: ${{ inputs.test_mode && 'CN=CCTI Local Validation' || secrets.CCTI_APPX_PUBLISHER }}
          CCTI_APPX_PUBLISHER_DISPLAY_NAME: ${{ inputs.test_mode && 'CCTI Local Validation' || secrets.CCTI_APPX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Resolve-Path '../releases/test-builds'
          $appx = @(Get-ChildItem -Path $output -Filter '*.appx' -File | Sort-Object Name)
          if ($appx.Count -ne 2) { throw "Expected one x64 and one ARM64 .appx package; found $($appx.Count)." }

          $makeAppx = Get-ChildItem -Path (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin') -Filter 'MakeAppx.exe' -File -Recurse |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $makeAppx) { throw 'MakeAppx.exe was not found on the Windows runner.' }

          $staging = Join-Path $env:RUNNER_TEMP 'ccti-clean-install-bundle-input'
          $bundle = Join-Path $env:RUNNER_TEMP 'claude-code-tools-installer-clean-install-test.msixbundle'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item -Path $appx.FullName -Destination $staging -Force
          & $makeAppx.FullName bundle /d $staging /p $bundle /o
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $bundle)) { throw 'MakeAppx did not create the temporary test bundle.' }
          Copy-Item -Path $bundle -Destination (Join-Path $env:RUNNER_TEMP 'ccti-clean-install-input.msixbundle') -Force

      - name: Run current-user install, AUMID launch, and uninstall lifecycle
        env:
          CCTI_APPX_IDENTITY_NAME: ${{ inputs.test_mode && 'CCTI.LocalValidation' || secrets.CCTI_APPX_IDENTITY_NAME }}
          CCTI_APPX_PUBLISHER: ${{ inputs.test_mode && 'CN=CCTI Local Validation' || secrets.CCTI_APPX_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ../scripts/test-signed-per-user-msix.ps1 `
            -UnsignedBundle (Join-Path $env:RUNNER_TEMP 'ccti-clean-install-input.msixbundle') `
            -IdentityName $env:CCTI_APPX_IDENTITY_NAME `
            -Publisher $env:CCTI_APPX_PUBLISHER `
            -ProcessName 'Claude Code Tools Installer'
      - name: Remove generated Store configuration
        if: always()
        run: Remove-Item -Force 'build/appx-store.resolved.json' -ErrorAction SilentlyContinue
