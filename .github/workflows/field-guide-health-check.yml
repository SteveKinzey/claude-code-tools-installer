name: Verify Live Field Guide

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the verification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify deployed Field Guide links and downloadable PDF
        run: |
          chmod +x docs/field-guide-publication-skill/scripts/verify_live_field_guide.sh
          docs/field-guide-publication-skill/scripts/verify_live_field_guide.sh

  notify-on-failure:
    needs: verify-live-guide
    if: ${{ always() && needs.verify-live-guide.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout the notification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Notify Discord or Slack webhook about the failed health check
        env:
          FIELD_GUIDE_ALERT_WEBHOOK: ${{ secrets.FIELD_GUIDE_ALERT_WEBHOOK }}
          FIELD_GUIDE_ALERT_PROVIDER: ${{ vars.FIELD_GUIDE_ALERT_PROVIDER }}
          FIELD_GUIDE_URL: https://stevekinzey.github.io/claude-code-tools-installer/
        run: |
          chmod +x docs/field-guide-publication-skill/scripts/notify_health_check_failure.sh
          docs/field-guide-publication-skill/scripts/notify_health_check_failure.sh
