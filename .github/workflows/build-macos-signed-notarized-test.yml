name: Build signed notarized macOS CCTI test artifact

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Optional full commit SHA reachable from protected main; dispatch this workflow from main"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Sign, notarize, and verify macOS artifact
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    env:
      NOTARIZE: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare immutable runtime source
        id: source
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "Dispatch this secret-bearing workflow only from protected main." >&2
            exit 2
          }
          SOURCE_REF="${SOURCE_REF:-$GITHUB_SHA}"
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_ref must be a full immutable commit SHA, not a branch or tag." >&2
            exit 2
          }
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          source_commit="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet --end-of-options "${SOURCE_REF}^{commit}")" || {
            echo "source_ref commit was not found." >&2
            exit 2
          }
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$source_commit" refs/remotes/origin/main || {
            echo "source_ref must be reachable from protected main before signing." >&2
            exit 2
          }
          git -C "$GITHUB_WORKSPACE" checkout --detach --force "$source_commit"
          git -C "$GITHUB_WORKSPACE" diff --quiet "$source_commit" || {
            echo "Checked-out workspace does not exactly match $source_commit." >&2
            exit 2
          }
          test -z "$(git -C "$GITHUB_WORKSPACE" status --porcelain)" || {
            echo "Checked-out workspace is not clean at $source_commit." >&2
            exit 2
          }
          printf 'Packaging runtime source: %s\n' "$source_commit"
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'

      - name: Confirm managed secrets are available
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          for value in "$MACOS_CERTIFICATE_P12_BASE64" "$CSC_KEY_PASSWORD" "$CSC_NAME" "$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID"; do
            test -n "$value" || { echo "A required macOS signing or notarization secret is unavailable." >&2; exit 2; }
          done

      - name: Prepare ephemeral signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/ccti-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | { base64 --decode 2>/dev/null || base64 -D; } > "$certificate_path"
          test -s "$certificate_path"
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"

      - name: Install desktop dependencies
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci
          else
            echo "No package-lock.json exists in the requested historical source; resolving dependencies for this test-only build."
            npm install --no-audit --no-fund --package-lock=false
          fi

      - name: Validate desktop contracts
        run: npm run check

      - name: Build signed macOS DMG and ZIP
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: npm run dist:mac:signed

      - name: Notarize final DMG, staple, and verify
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          dmg="$(find ../releases/test-builds -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
          bash ../scripts/verify-signed-macos-dmg.sh "$dmg"

      - name: Upload signed test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ccti-macos-signed-notarized-test-${{ steps.source.outputs.commit }}
          path: |
            releases/test-builds/*.dmg
            releases/test-builds/*.zip
          if-no-files-found: error
          retention-days: 7
