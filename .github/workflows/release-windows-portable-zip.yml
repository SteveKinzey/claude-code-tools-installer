name: Block unsigned Windows portable ZIP release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing daily-revision release tag to evaluate without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-windows-portable-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  block-unsigned-portable-upload:
    name: Block unsigned portable Windows release upload
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Preserve Windows release safety boundary
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d{4}\.\d{2}\.\d{2}\.\d{2}$') {
            throw 'Use an existing daily revision tag such as v2026.09.22.01.'
          }
          @"
          ## Windows portable ZIP release blocked

          CCTI no longer builds or uploads an unsigned portable Windows ZIP from this workflow.

          The requested tag was: ``$env:RELEASE_TAG``.

          A public Windows executable requires a separately approved, immutable-tag release workflow that verifies the package version, embedded executable version, Authenticode signature status, trusted publisher identity, and SHA-256 before publishing a draft release. Microsoft Store MSIX remains the supported managed Windows distribution path.
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
