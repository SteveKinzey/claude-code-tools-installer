name: Release signed and notarized macOS DMG

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, such as v2026.09.09"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and release macOS DMG
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      CSC_NAME: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - id: release
        name: Validate release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$REF_NAME"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi
          [[ "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]] || {
            echo "Use a dated tag such as v2026.09.09." >&2
            exit 2
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Confirm required secrets are available
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          for name in MACOS_CERTIFICATE_P12_BASE64 CSC_KEY_PASSWORD CSC_NAME APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            value="${!name:-}"
            [[ -n "$value" ]] || { echo "Required secret is unavailable: $name" >&2; exit 2; }
          done

      - name: Prepare ephemeral signing and notarization credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/claude-tools-developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | { base64 --decode 2>/dev/null || base64 -D; } > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | { base64 --decode 2>/dev/null || base64 -D; } > "$api_key_path"
          test -s "$certificate_path"
          test -s "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"

      - name: Install and validate desktop dependencies
        run: |
          npm ci
          npm run check

      - name: Build a signed macOS DMG and ZIP
        run: npm run dist:mac:signed

      - id: artifact
        name: Identify release candidate
        run: |
          dmg="$(find ../releases/test-builds -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Notarize the final DMG and staple the ticket
        env:
          DMG: ${{ steps.artifact.outputs.dmg }}
        run: |
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Verify signature, Gatekeeper, and stapled ticket
        env:
          DMG: ${{ steps.artifact.outputs.dmg }}
        run: bash ../scripts/verify-signed-macos-dmg.sh "$DMG"

      - id: checksum
        name: Create SHA-256 checksum
        env:
          DMG: ${{ steps.artifact.outputs.dmg }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          output_dir="../releases/test-builds/release"
          mkdir -p "$output_dir"
          checksum="$output_dir/claude-code-tools-installer-macos-${TAG}.sha256"
          shasum -a 256 "$DMG" > "$checksum"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Attach verified DMG and checksum to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          DMG: ${{ steps.artifact.outputs.dmg }}
          CHECKSUM: ${{ steps.checksum.outputs.checksum }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" "$DMG" "$CHECKSUM"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-code-tools-installer-macos-${{ steps.release.outputs.tag || github.sha }}
          path: |
            releases/test-builds/*.dmg
            releases/test-builds/*.zip
            releases/test-builds/release/*.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Remove ephemeral credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/claude-tools-developer-id.p12" \
                "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
