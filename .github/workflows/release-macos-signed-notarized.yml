name: Release signed and notarized macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing reviewed daily release tag; dispatch from that exact tag"
        required: true
        type: string

permissions:
  contents: read

# Every writer and publisher of the same release holds this shared lock.
concurrency:
  group: ccti-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  source:
    if: github.ref_type == 'tag' && github.ref_name == inputs.tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: release
        name: Validate release tag and reviewed source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]] || exit 2
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          source_commit="$(git rev-parse --verify --end-of-options "${TAG}^{commit}")"
          test "$source_commit" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$source_commit" refs/remotes/origin/main
          node scripts/release-identity.js --tag "$TAG" --package-json desktop/package.json --require-daily-revision
          echo "commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./desktop/package.json").version')" >> "$GITHUB_OUTPUT"

  package:
    needs: source
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/macos-isolated-sign.yml
    with:
      source_commit: ${{ needs.source.outputs.commit }}
      version: ${{ needs.source.outputs.version }}
    secrets: inherit

  stage:
    needs: [source, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: staged
          merge-multiple: true
      - id: files
        name: Verify exact signed source and bytes before staging
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          prefix="staged/Claude-Code-Tools-Installer-${VERSION}-mac-arm64"
          gh attestation verify "${prefix}.dmg" --repo "$GITHUB_REPOSITORY" \
            --bundle staged/macos-source-binding.sigstore.json \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/macos-isolated-sign.yml" \
            --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners \
            --predicate-type https://claudetool.app/attestations/macos-source/v1 \
            --format json > "$RUNNER_TEMP/macos-verified.json"
          python3 scripts/macos-release-controller.py verify --directory staged --source "$SOURCE_COMMIT" --controller "$GITHUB_SHA" --version "$VERSION" --verified "$RUNNER_TEMP/macos-verified.json"
          echo "dmg=${prefix}.dmg" >> "$GITHUB_OUTPUT"
          echo "zip=${prefix}.zip" >> "$GITHUB_OUTPUT"
          echo "metadata=staged/latest-mac.yml" >> "$GITHUB_OUTPUT"
          echo "dmg_checksum=${prefix}.dmg.sha256" >> "$GITHUB_OUTPUT"
          echo "zip_checksum=${prefix}.zip.sha256" >> "$GITHUB_OUTPUT"

      - name: Attach native update files, notarized DMG, and checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
          DMG: ${{ steps.files.outputs.dmg }}
          ZIP: ${{ steps.files.outputs.zip }}
          METADATA: ${{ steps.files.outputs.metadata }}
          DMG_CHECKSUM: ${{ steps.files.outputs.dmg_checksum }}
          ZIP_CHECKSUM: ${{ steps.files.outputs.zip_checksum }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
            echo "Refusing to modify an already-public release. Create a new release tag for a corrected artifact." >&2
            exit 2
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$SOURCE_COMMIT" --title "$TAG" --generate-notes --draft
          release_database_id="$(gh release view "$TAG" --json databaseId --jq '.databaseId')"
          [[ "$release_database_id" =~ ^[0-9]+$ ]] || {
            echo "Draft release is missing a numeric databaseId." >&2
            exit 2
          }
          # Upload one asset per request. GitHub can finish a large DMG upload
          # after a concurrent batch has tried to replace it, producing a false
          # duplicate-name failure. Even single-asset --clobber can still race
          # with an existing asset, so remove any matching asset name first and
          # retry the upload a few times before failing the release job.
          upload_release_asset() {
            local artifact="$1"
            local artifact_name release_asset_database_id attempt
            artifact_name="$(basename "$artifact")"
            for attempt in 1 2 3; do
              [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" == true ]] || { echo "Refusing to modify an already-public release." >&2; return 2; }
              release_asset_database_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_database_id/assets?per_page=100" --paginate --jq ".[] | select(.name == \"$artifact_name\") | .id" | head -n 1)"
              if [[ -n "$release_asset_database_id" ]]; then
                [[ "$release_asset_database_id" =~ ^[0-9]+$ ]] || {
                  echo "Existing release asset is missing a numeric database ID: $artifact_name" >&2
                  return 1
                }
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$release_asset_database_id"
                sleep 5
              fi
              [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" == true ]] || return 2
              if gh release upload "$TAG" "$artifact"; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                printf 'Retrying GitHub Release asset upload for %s (attempt %s/3).\n' "$artifact_name" "$((attempt + 1))" >&2
                sleep 10
              fi
            done
            echo "GitHub Release asset upload failed after 3 attempts: $artifact_name" >&2
            return 1
          }
          for artifact in "$DMG" "$ZIP" "$METADATA" "$DMG_CHECKSUM" "$ZIP_CHECKSUM" staged/macos-source-predicate.json staged/macos-source-binding.sigstore.json; do
            upload_release_asset "$artifact"
          done

      - name: Verify draft macOS asset inventory before cross-platform handoff
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DMG: ${{ steps.files.outputs.dmg }}
          ZIP: ${{ steps.files.outputs.zip }}
          METADATA: ${{ steps.files.outputs.metadata }}
          DMG_CHECKSUM: ${{ steps.files.outputs.dmg_checksum }}
          ZIP_CHECKSUM: ${{ steps.files.outputs.zip_checksum }}
        run: |
          release_json="$(gh release view "$TAG" --json id,isDraft,assets)"
          node - "$release_json" "$DMG" "$ZIP" "$METADATA" "$DMG_CHECKSUM" "$ZIP_CHECKSUM" <<'NODE'
          const fs = require('node:fs');
          const release = JSON.parse(process.argv[2]);
          const files = process.argv.slice(3);
          if (!release.isDraft) throw new Error('Release must remain a draft until final inventory verification succeeds.');
          const assets = new Map(release.assets.map((asset) => [asset.name, asset]));
          const required = files.map((file) => ({ file, name: require('node:path').basename(file) }));
          for (const { name } of required) {
            const asset = assets.get(name);
            if (!asset || asset.state !== 'uploaded' || !Number.isFinite(asset.size) || asset.size <= 0 || !/^sha256:[a-f0-9]{64}$/i.test(asset.digest || '')) {
              throw new Error(`Draft release is missing a verified uploaded asset: ${name}`);
            }
          }
          for (const { file, name } of required.filter(({ name }) => name.endsWith('.sha256'))) {
            const [digest, target] = fs.readFileSync(file, 'utf8').trim().split(/\s{2,}/);
            const artifact = assets.get(target);
            if (!artifact || artifact.digest.toLowerCase() !== `sha256:${digest}`.toLowerCase()) {
              throw new Error(`Checksum sidecar ${name} does not match the uploaded asset ${target}.`);
            }
          }
          const metadata = fs.readFileSync(files[2], 'utf8');
          for (const { name } of required.slice(0, 2)) {
            if (!metadata.includes(name)) throw new Error(`latest-mac.yml does not reference ${name}.`);
          }
          NODE

      - name: Leave verified macOS assets on the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
          [[ "$is_draft" == true ]] || {
            echo "Release must remain a draft until Linux assets and cross-platform verification succeed." >&2
            exit 2
          }
          echo "macOS assets are staged on draft release $TAG. Run Publish verified cross-platform CCTI release from the same tag after Linux signing completes."
