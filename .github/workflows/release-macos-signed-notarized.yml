name: Release signed and notarized macOS DMG

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, such as v2026.09.09"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize, and release macOS DMG
    runs-on: macos-14
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: bash

    steps:
      - name: Check out hardened release automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: release
        name: Validate release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$REF_NAME"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          fi
          [[ "$tag" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]] || {
            echo "Use a dated tag such as v2026.09.09." >&2
            exit 2
          }
          git -C "$GITHUB_WORKSPACE" rev-parse --verify --quiet "${tag}^{commit}" >/dev/null || {
            echo "Release tag was not found: $tag" >&2
            exit 2
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C "$GITHUB_WORKSPACE" rev-parse "${tag}^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Prepare immutable runtime source
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git -C "$GITHUB_WORKSPACE" checkout "$TAG" -- desktop setup-my-claude.sh setup-my-claude-linux.sh setup-my-claude.ps1
          git -C "$GITHUB_WORKSPACE" diff --quiet "$TAG" -- desktop setup-my-claude.sh setup-my-claude-linux.sh setup-my-claude.ps1 || {
            echo "Runtime source does not exactly match $TAG." >&2
            exit 2
          }
          printf 'Packaging runtime source: %s\n' "$(git -C "$GITHUB_WORKSPACE" rev-parse "${TAG}^{commit}")"

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - id: notary_auth
        name: Confirm required secrets are available
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          for name in MACOS_CERTIFICATE_P12_BASE64 CSC_KEY_PASSWORD CSC_NAME; do
            value="${!name:-}"
            [[ -n "$value" ]] || { echo "Required secret is unavailable: $name" >&2; exit 2; }
          done
          if [[ -n "${APPLE_API_KEY_BASE64:-}" && -n "${APPLE_API_KEY_ID:-}" && -n "${APPLE_API_ISSUER:-}" ]]; then
            echo "notary_auth=api_key" >> "$GITHUB_OUTPUT"
          elif [[ -n "${APPLE_ID:-}" && -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${APPLE_TEAM_ID:-}" ]]; then
            echo "notary_auth=apple_id" >> "$GITHUB_OUTPUT"
          else
            echo "A complete App Store Connect API-key or Apple ID notarization secret set is required." >&2
            exit 2
          fi

      - name: Prepare ephemeral signing and notarization credentials
        if: steps.notary_auth.outputs.notary_auth == 'api_key'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          certificate_path="$RUNNER_TEMP/claude-tools-developer-id.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | { base64 --decode 2>/dev/null || base64 -D; } > "$certificate_path"
          printf '%s' "$APPLE_API_KEY_BASE64" | { base64 --decode 2>/dev/null || base64 -D; } > "$api_key_path"
          test -s "$certificate_path"
          test -s "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"

      - name: Prepare ephemeral signing certificate
        if: steps.notary_auth.outputs.notary_auth == 'apple_id'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/claude-tools-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | { base64 --decode 2>/dev/null || base64 -D; } > "$certificate_path"
          test -s "$certificate_path"
          chmod 600 "$certificate_path"
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"

      - name: Install and validate desktop dependencies
        run: |
          npm ci
          npm run check

      - name: Build a signed macOS DMG and ZIP
        env:
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: npm run dist:mac:signed

      - id: artifact
        name: Identify release candidate
        run: |
          dmg="$(find ../releases/test-builds -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          zip="$(find ../releases/test-builds -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$dmg"
          test -n "$zip"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Notarize the final DMG and staple the ticket
        env:
          DMG: ${{ steps.artifact.outputs.dmg }}
          NOTARY_AUTH: ${{ steps.notary_auth.outputs.notary_auth }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          if [[ "$NOTARY_AUTH" == 'api_key' ]]; then
            xcrun notarytool submit "$DMG" \
              --key "$APPLE_API_KEY" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait
          else
            xcrun notarytool submit "$DMG" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait
          fi
          xcrun stapler staple "$DMG"

      - name: Verify signature, Gatekeeper, and stapled ticket
        env:
          DMG: ${{ steps.artifact.outputs.dmg }}
        run: bash ../scripts/verify-signed-macos-dmg.sh "$DMG"

      - id: checksums
        name: Create SHA-256 checksums
        env:
          DMG: ${{ steps.artifact.outputs.dmg }}
          ZIP: ${{ steps.artifact.outputs.zip }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          output_dir="../releases/test-builds/release"
          mkdir -p "$output_dir"
          dmg_checksum="$output_dir/claude-code-tools-installer-macos-${TAG}.dmg.sha256"
          zip_checksum="$output_dir/claude-code-tools-installer-macos-${TAG}.zip.sha256"
          shasum -a 256 "$DMG" > "$dmg_checksum"
          shasum -a 256 "$ZIP" > "$zip_checksum"
          echo "dmg_checksum=$dmg_checksum" >> "$GITHUB_OUTPUT"
          echo "zip_checksum=$zip_checksum" >> "$GITHUB_OUTPUT"

      - name: Attach verified macOS artifacts and checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.release.outputs.commit }}
          DMG: ${{ steps.artifact.outputs.dmg }}
          ZIP: ${{ steps.artifact.outputs.zip }}
          DMG_CHECKSUM: ${{ steps.checksums.outputs.dmg_checksum }}
          ZIP_CHECKSUM: ${{ steps.checksums.outputs.zip_checksum }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$SOURCE_COMMIT" --title "$TAG" --generate-notes
          gh release upload "$TAG" "$DMG" "$ZIP" "$DMG_CHECKSUM" "$ZIP_CHECKSUM"

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-code-tools-installer-macos-${{ steps.release.outputs.tag || github.sha }}
          path: |
            releases/test-builds/*.dmg
            releases/test-builds/*.zip
            releases/test-builds/release/*.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Remove ephemeral credentials
        if: always()
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          rm -f "$RUNNER_TEMP/claude-tools-developer-id.p12" \
                "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
