name: Build, sign, and stage Windows CCTI installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing daily-revision tag, such as v2026.09.22.03
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: windows-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, verify, and stage Windows installer
    if: github.ref_type == 'tag' && github.ref_name == inputs.tag
    runs-on: windows-2022
    environment: windows-release
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
        shell: pwsh

    steps:
      - name: Check out immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0

      - id: release
        name: Validate daily release identity
        env:
          TAG: ${{ inputs.tag }}
        run: |
          node ../scripts/release-identity.js --tag $env:TAG --package-json package.json --require-daily-revision
          $commit = (git rev-parse $env:TAG).Trim()
          if ($commit -notmatch '^[0-9a-f]{40}$') { throw 'Release tag did not resolve to an immutable commit.' }
          "tag=$env:TAG" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install and validate desktop dependencies
        run: |
          npm ci
          npm run check

      - name: Sign in to Azure through GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build signed x64 NSIS installer
        env:
          AZURE_CODESIGN_ENDPOINT: ${{ vars.AZURE_CODESIGN_ENDPOINT }}
          AZURE_CODESIGN_ACCOUNT_NAME: ${{ vars.AZURE_CODESIGN_ACCOUNT_NAME }}
          AZURE_CODESIGN_PROFILE_NAME: ${{ vars.AZURE_CODESIGN_PROFILE_NAME }}
          CCTI_WINDOWS_PUBLISHER_NAME: ${{ vars.CCTI_WINDOWS_PUBLISHER_NAME }}
        run: |
          Remove-Item ..\releases\test-builds\*-win-x64.exe -Force -ErrorAction SilentlyContinue
          npm run dist:win:signed:x64

      - id: artifact
        name: Verify one signed installer and updater feed
        env:
          EXPECTED_PUBLISHER: ${{ vars.CCTI_WINDOWS_PUBLISHER_NAME }}
        run: |
          $installers = @(Get-ChildItem ..\releases\test-builds -File -Filter '*-win-x64.exe' | Where-Object { $_.Name -notmatch 'uninstaller' })
          if ($installers.Count -ne 1) { throw "Expected exactly one x64 NSIS installer; found $($installers.Count)." }
          $installer = $installers[0]
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Authenticode status is $($signature.Status)." }
          if (-not $signature.TimeStamperCertificate) { throw 'Installer is missing an RFC3161 timestamp.' }
          if ($signature.SignerCertificate.Subject -notlike "*$env:EXPECTED_PUBLISHER*") { throw "Unexpected signer subject: $($signature.SignerCertificate.Subject)" }
          $metadata = Join-Path $installer.DirectoryName 'latest.yml'
          if (-not (Test-Path -LiteralPath $metadata -PathType Leaf)) { throw 'electron-builder did not create latest.yml.' }
          if (-not (Select-String -LiteralPath $metadata -SimpleMatch $installer.Name -Quiet)) { throw 'latest.yml does not reference the signed installer.' }
          if (-not (Select-String -LiteralPath $metadata -SimpleMatch 'sha512:' -Quiet)) { throw 'latest.yml is missing its SHA-512 updater digest.' }
          $checksum = "$($installer.FullName).sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath $checksum -NoNewline
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum=$checksum" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "metadata=$metadata" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create or reuse matching draft release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          $existing = gh release view $env:TAG --json isDraft 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:TAG --target $env:COMMIT --title $env:TAG --generate-notes --draft }
          $isDraft = gh release view $env:TAG --json isDraft --jq '.isDraft'
          if ($isDraft -ne 'true') { throw 'Windows signing only stages assets on a draft release.' }

      - name: Upload staged Windows assets
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          INSTALLER: ${{ steps.artifact.outputs.installer }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
          METADATA: ${{ steps.artifact.outputs.metadata }}
        run: gh release upload $env:TAG $env:INSTALLER $env:CHECKSUM $env:METADATA --clobber

      - name: Verify staged Windows asset inventory
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          INSTALLER: ${{ steps.artifact.outputs.installer }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
          METADATA: ${{ steps.artifact.outputs.metadata }}
        run: |
          $release = gh release view $env:TAG --json isDraft,assets | ConvertFrom-Json
          if (-not $release.isDraft) { throw 'Release must remain a draft until the shared publisher verifies every platform.' }
          $assets = @{}
          foreach ($asset in $release.assets) { $assets[$asset.name] = $asset }
          $required = @($env:INSTALLER, $env:CHECKSUM, $env:METADATA) | ForEach-Object { Split-Path $_ -Leaf }
          foreach ($name in $required) {
            $asset = $assets[$name]
            if (-not $asset -or $asset.state -ne 'uploaded' -or $asset.digest -notmatch '^sha256:[a-f0-9]{64}$') { throw "Draft release is missing a verified uploaded Windows asset: $name" }
          }
          $parts = (Get-Content -LiteralPath $env:CHECKSUM -Raw).Trim() -split '\s{2,}'
          $installerName = Split-Path $env:INSTALLER -Leaf
          if ($parts.Count -ne 2 -or $parts[1] -ne $installerName -or $assets[$installerName].digest.ToLowerInvariant() -ne "sha256:$($parts[0].ToLowerInvariant())") { throw 'Windows checksum sidecar does not match the uploaded installer.' }
          if (-not (Select-String -LiteralPath $env:METADATA -SimpleMatch $installerName -Quiet)) { throw 'latest.yml does not reference the staged installer.' }

      - name: Leave verified Windows assets on the draft release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ((gh release view $env:TAG --json isDraft --jq '.isDraft') -ne 'true') { throw 'Release must remain a draft until the shared publisher verifies macOS, Linux, and Windows assets.' }

      - name: Upload Windows signing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-code-tools-installer-windows-${{ steps.release.outputs.tag || github.sha }}
          path: |
            releases/test-builds/*-win-x64.exe
            releases/test-builds/*-win-x64.exe.sha256
            releases/test-builds/latest.yml
          if-no-files-found: warn
          retention-days: 14
