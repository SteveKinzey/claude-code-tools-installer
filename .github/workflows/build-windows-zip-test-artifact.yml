name: Build Windows CCTI ZIP test artifact

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Existing immutable daily revision tag for an unsigned NSIS build only'
        required: false
        default: ''
        type: string
      source_commit:
        description: 'Expected full tagged commit SHA; required with source_tag'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    if: inputs.source_tag == '' && inputs.source_commit == ''
    name: Build Windows ZIP artifact
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'

      - name: Install desktop dependencies
        run: npm ci

      - name: Validate desktop contracts
        run: npm run check

      - name: Build Windows ZIP
        run: npm run dist:win:zip

      - name: Inspect ZIP contents
        run: |
          $zip = Get-ChildItem ../releases/test-builds/*.zip | Select-Object -First 1
          if (-not $zip) { throw 'No Windows ZIP was produced.' }
          $target = Join-Path $env:RUNNER_TEMP 'ccti-windows-zip-check'
          Expand-Archive -Path $zip.FullName -DestinationPath $target -Force
          if (-not (Get-ChildItem $target -Recurse -Filter 'Claude Code Tools Installer.exe' | Select-Object -First 1)) { throw 'Packaged application executable is missing.' }
          if (-not (Get-ChildItem $target -Recurse -Filter 'setup-my-claude.ps1' | Select-Object -First 1)) { throw 'Packaged Windows installer resource is missing.' }

      - name: Upload test artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccti-windows-zip-test-${{ github.sha }}
          path: releases/test-builds/*.zip
          if-no-files-found: error
          retention-days: 7

  unsigned:
    if: inputs.source_tag != '' || inputs.source_commit != ''
    name: Build exact-tag unsigned Windows NSIS artifact
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.preparation.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_TAG: ${{ inputs.source_tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out reviewed build controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Export and validate immutable source
        run: |
          if ($env:SOURCE_TAG -notmatch '^v\d{4}\.\d{2}\.\d{2}\.\d{2}$' -or $env:SOURCE_COMMIT -notmatch '^[0-9a-f]{40}$') { throw 'Require immutable daily tag and expected full SHA.' }
          $actual = git rev-parse "$($env:SOURCE_TAG)^{commit}"
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:SOURCE_COMMIT) { throw 'Tag commit differs from expected source.' }
          git -c core.autocrlf=false archive --format=tar --output="$env:RUNNER_TEMP\source.tar" $env:SOURCE_TAG
          if ($LASTEXITCODE -ne 0) { throw 'Could not export tagged source.' }
          New-Item -ItemType Directory -Path "$env:GITHUB_WORKSPACE\product" | Out-Null
          tar -xf "$env:RUNNER_TEMP\source.tar" -C "$env:GITHUB_WORKSPACE\product"
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract tagged source.' }
          node scripts/release-identity.js --tag $env:SOURCE_TAG --package-json product/desktop/package.json --require-daily-revision
          if ($LASTEXITCODE -ne 0) { throw 'Tagged package identity failed.' }
      - name: Install and validate exact-tag desktop source
        working-directory: product/desktop
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Locked install failed.' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Full exact-tag desktop validation failed.' }
      - name: Build unsigned exact-tag x64 installer
        working-directory: product/desktop
        run: |
          npm run dist:win:unsigned:x64
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned NSIS packaging failed.' }
      - name: Verify unsigned state, source parity, checksums and updater metadata
        run: |
          $installers = @(Get-ChildItem product/releases/test-builds -File -Filter '*-win-x64.exe' | Where-Object { $_.Name -notmatch 'uninstaller' })
          if ($installers.Count -ne 1) { throw 'Require exactly one x64 NSIS installer.' }
          if ((Get-AuthenticodeSignature -FilePath $installers[0].FullName).Status -ne 'NotSigned') { throw 'Expected intentionally unsigned installer.' }
          node scripts/prepare-windows-unsigned-artifact.cjs "$env:GITHUB_WORKSPACE\product" $env:GITHUB_WORKSPACE "$env:GITHUB_WORKSPACE\product\releases\test-builds" $env:SOURCE_TAG $env:SOURCE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Source/hash/feed verification failed.' }
      - name: Upload verified unsigned build inputs
        id: preparation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccti-windows-unsigned-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            product/releases/test-builds/*-win-x64.exe
            product/releases/test-builds/*-win-x64.exe.sha256
            product/releases/test-builds/latest.yml
            product/releases/test-builds/windows-unsigned-source*.json
          if-no-files-found: error
          retention-days: 30

  attest-unsigned:
    name: Attest verified unsigned Windows build
    needs: unsigned
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    steps:
      # Never install dependencies or execute tagged source in this privileged job.
      - name: Download only this run's verified build inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.unsigned.outputs.artifact_id }}
          path: attestation-inputs
          merge-multiple: true
      - id: inputs
        name: Independently bind downloaded bytes to selected source and controller
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          $files = @(Get-ChildItem attestation-inputs -File -Filter '*-win-x64.exe')
          if ($files.Count -ne 1) { throw 'Require exactly one downloaded installer.' }
          $installer = $files[0]
          if ((Get-AuthenticodeSignature -FilePath $installer.FullName).Status -ne 'NotSigned') { throw 'Expected intentionally unsigned downloaded installer.' }
          $receipt = Get-Content -LiteralPath attestation-inputs/windows-unsigned-source-predicate.json -Raw | ConvertFrom-Json
          if ($receipt.source_tag -ne $env:SOURCE_TAG -or $receipt.source_commit -ne $env:SOURCE_COMMIT -or $receipt.controller_commit -ne $env:GITHUB_SHA) { throw 'Downloaded source/controller receipt mismatch.' }
          if ($receipt.workflow_run -ne "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") { throw 'Receipt must belong to this workflow run.' }
          if ($receipt.installer.name -ne $installer.Name -or $receipt.installer.size -ne $installer.Length) { throw 'Downloaded installer identity mismatch.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          if ($receipt.installer.sha256 -ne $hash) { throw 'Downloaded installer SHA-256 mismatch.' }
          $checksum = (Get-Content -LiteralPath "$($installer.FullName).sha256" -Raw).Trim()
          if ($checksum -ne "$hash  $($installer.Name)") { throw 'Downloaded checksum mismatch.' }
          "installer=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Attest installer build-controller provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.inputs.outputs.installer }}
      - name: Attest exact tagged product source binding
        id: source
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.inputs.outputs.installer }}
          predicate-type: https://claudetool.app/attestations/windows-unsigned-source/v1
          predicate-path: attestation-inputs/windows-unsigned-source-predicate.json
      - name: Preserve attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SOURCE_BUNDLE: ${{ steps.source.outputs.bundle-path }}
        run: |
          Copy-Item -LiteralPath $env:PROVENANCE_BUNDLE -Destination attestation-inputs/windows-build-provenance.sigstore.json
          Copy-Item -LiteralPath $env:SOURCE_BUNDLE -Destination attestation-inputs/windows-source-binding.sigstore.json
      - name: Upload verified unsigned installer preparation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccti-windows-unsigned-${{ inputs.source_tag }}-${{ github.sha }}
          path: attestation-inputs/*
          if-no-files-found: error
          retention-days: 30
