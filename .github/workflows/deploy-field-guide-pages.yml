name: Deploy Field Guide to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/installation-guide/site/**'
      - '.github/workflows/deploy-field-guide-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-guide-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Preserve static assets without Jekyll processing
        run: touch docs/installation-guide/site/.nojekyll
      - name: Include the downloadable PDF in the Pages artifact
        run: |
          mkdir -p docs/installation-guide/site/downloads
          cp docs/installation-guide/downloads/claude-code-tools-installer-guide-2026.pdf docs/installation-guide/site/downloads/
      - name: Upload Field Guide site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/installation-guide/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Field Guide site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
