name: Deploy Field Guide to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/installation-guide/site/**'
      - '.github/workflows/deploy-field-guide-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: field-guide-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preserve static assets without Jekyll processing
        run: touch docs/installation-guide/site/.nojekyll
      - name: Include the downloadable PDF in the Pages artifact
        run: |
          mkdir -p docs/installation-guide/site/downloads
          cp docs/installation-guide/downloads/claude-code-tools-installer-guide-2026.pdf docs/installation-guide/site/downloads/
      - name: Upload Field Guide site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/installation-guide/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Field Guide site
        id: deployment
        uses: actions/deploy-pages@v4
